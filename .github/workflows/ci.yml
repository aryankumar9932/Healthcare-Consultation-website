name: CI
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Healthcare-Consultation-website-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Healthcare-Consultation-website-master/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python train.py && pytest -q
